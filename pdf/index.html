<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title> PortFolio | Resume</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="style.css" />

</head>

<body>
    <div class="container-fluid overcover" id="page">
        <div class="container profile-box">
            <div class="row">
                <div class="col-md-4 left-co">
                    <div class="left-side">
                        <div class="profile-info">
                            <img src="" alt="" id="user_img">
                            <h3 id="user_name"></h3>
                            <span id="user_profession"></span>
                        </div>
                        <h4 class="ltitle">Contact</h4>
                        <div class="contact-box pb0">
                            <div class="icon">
                                <i class="fas fa-phone"></i>
                            </div>
                            <div class="detail" id="user_cell">
                            </div>
                        </div>
                        <div class="contact-box">
                            <div class="icon">
                                <i class="fas fa-globe-americas"></i>
                            </div>
                            <div class="detail" id="user_email">
                            </div>
                        </div>
                        <div class="contact-box">
                            <div class="icon">
                                <i class="fas fa-map-marker-alt"></i>
                            </div>
                            <div class="detail" id="user_address">

                            </div>
                        </div>
                        <h4 class="ltitle">Social Media Platforms</h4>
                        <ul class="row social-link no-margin" id="user_social">
                        </ul>
                        <h4 class="ltitle">Hobbies</h4>
                        <ul class="hoby row no-margin">
                            <li><i class="fas fa-pencil-alt"></i> <br> Writing</li>
                            <li><i class="fas fa-bicycle"></i> <br> Cycling</li>
                            <li><i class="fas fa-futbol"></i> <br> Football</li>
                            <li><i class="fas fa-film"></i><br> Movies</li>
                            <li><i class="fas fa-plane-departure"></i> <br>Travel</li>
                            <li><i class="fas fa-gamepad"></i> <br> Games</li>
                        </ul>
                    </div>
                </div>
                <div class="col-md-8 rt-div">
                    <div class="rit-cover">
                        <div class="hotkey">
                            <h1 class="" id="main_user_name"></h1>
                            <small id="main_user_profession"></small>
                        </div>
                        <h2 class="rit-titl"><i class="far fa-user"></i> Profile</h2>
                        <div class="about">
                            <p id="user_about"></p>
                            <div class="btn-ro row no-margin">
                                <ul class="btn-link">
                                    <li>
                                        <a href="#" id="print_pdf" onclick="printPage()"><i class="fas fa-cloud-download-alt"></i> Download Resume</a>
                                    </li>
                                </ul>
                            </div>
                        </div>

                        <h2 class="rit-titl"><i class="fas fa-briefcase"></i> Work Experiance</h2>
                        <div class="work-exp">
                            <h6 id="user_designation"> <span id="user_profession_from_to"></span></h6>
                            <i id="user_profession_company"></i>
                            <ul>
                                <li><i class="far fa-hand-point-right"></i><p id="user_profession_about"></p></li>
                            </ul>
                        </div>
                        <h2 class="rit-titl"><i class="fas fa-graduation-cap"></i> Education</h2>
                        <div class="education">
                            <ul class="d-flex flex-wrap no-margin" id="education">
                            </ul>
                        </div>

                        <h2 class="rit-titl"><i class="fas fa-users-cog"></i> Skills</h2>
                        <div class="profess-cover row no-margin" id="skills">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>

<script>
    $(document).ready(function (){
        function getQueryParam(param) {
            let urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // getting user id from url
        let userId = getQueryParam('user_id');

        $.ajax({
            type: "POST",
            url: "/Portfolio/backend/dbHandler.php",
            dataType: 'json',
            data: {action: 'openPortfolio', user_id: userId},
            success: function(response) {
                if(response.message == 'success')
                {
                    $('#user_img').attr('src', response.personal.user_img);
                    $('#user_name').text(response.personal.user_name);
                    $('#user_profession').text(response.personal.user_profession);
                    $('#user_cell').text(response.personal.user_cell);
                    $('#user_email').text(response.personal.user_email);
                    $('#user_address').text(response.personal.user_address);
                    if(response.personal.social_fb)
                    {
                        $('#user_social').append('<li><i class="fab fa-facebook-f"></i></li>')
                    }
                    if(response.personal.social_tw)
                    {
                        $('#user_social').append('<li><i class="fab fa-twitter"></i></li>')
                    }
                    if(response.personal.social_in)
                    {
                        $('#user_social').append('<li><i class="fab fa-linkedin-in"></i></li>')
                    }
                    //     -----------------------------------------
                    $('#main_user_name').text(response.personal.user_name);
                    $('#main_user_profession').text(response.personal.user_profession);
                    $('#user_about').text(response.personal.user_about);
                    $('#user_designation').text(response.prof.designation);
                    $('#user_profession_from_to').text(response.prof.profession_from +" - "+response.prof.profession_to);
                    $('#user_profession_company').text(response.prof.profession_company);
                    $('#user_profession_about').text(response.prof.profession_about);
                    //     -----------------------------------------

                    $.each(response.edu, function(index, item) {
                        let edu_html = `
                        <li class="col-md-6">
                            <div style="display: block; width: 100%">
                                <span>${item.edu_from} - ${item.edu_to}</span><br>
                                <strong>${item.edu}</strong> (${item.edu_subject})<br>
                                <em>${item.edu_institue}</em>
                            </div>
                        </li>
                    `;
                        $('#education').append(edu_html);
                    });
                    //     -----------------------------------------
                    let skills = response.skills.skill.split(', ');
                    let ratings = response.skills.skill_ratings.split(', ');

                    for (let i = 0; i < skills.length; i++) {
                        let skill = skills[i];
                        let rating = ratings[i];

                        let skillHtml = `
                            <div class="col-md-6">
                                <div class=" prog-row row">
                                    <div class="col-sm-6">
                                        ${skill}
                                    </div>
                                    <div class="col-sm-6">
                                        <div class="progress">
                                            <div class="progress-bar" role="progressbar" style="width: ${rating}%" aria-valuenow="${rating}" aria-valuemin="0" aria-valuemax="100"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                `;
                        $('#skills').append(skillHtml);
                    }

                    let tools = response.tools.tool.split(', ');
                    let tool_ratings = response.tools.tool_ratings.split(', ');

                    for (let i = 0; i < tools.length; i++) {
                        let tool = tools[i];
                        let rating = tool_ratings[i];

                        let toolHtml = `
                            <div class="col-md-6">
                                <div class=" prog-row row">
                                    <div class="col-sm-6">
                                        ${tool}
                                    </div>
                                    <div class="col-sm-6">
                                        <div class="progress">
                                            <div class="progress-bar" role="progressbar" style="width: ${rating}%" aria-valuenow="${rating}" aria-valuemin="0" aria-valuemax="100"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                `;
                        $('#skills').append(toolHtml);
                    }

                }
            },
            error: function(xhr, status, error) {
                alert('Database error: ' + error);
            }
        });
    });
</script>
<script>

    function printPage()
    {
        let element = document.getElementById('page');
        let opt = {
            margin: [-0.3,0,-0.3,0], // Adjust margins if needed
            filename: 'mypdf.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 1, useCORS: true },
            pagebreak: { mode: 'avoid-all' },
            jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
        };

        html2pdf(element, opt);

    }
</script>

</html>
